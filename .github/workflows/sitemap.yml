name: Build SEO pages and sitemap
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['build-seo.mjs', 'index.html']
permissions:
  contents: write
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate category/group pages and sitemap.xml
        run: node build-seo.mjs
      - name: Commit if changed
        run: |
          git add -A
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update seo pages and sitemap"
          git push

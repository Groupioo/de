name: Update sitemap
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/generate-sitemap.mjs']
permissions:
  contents: write
jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate sitemap.xml
        run: node scripts/generate-sitemap.mjs sitemap.xml
      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain sitemap.xml)" ]; then echo "Keine Änderungen"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "chore: update sitemap"
          git push

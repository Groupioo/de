<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>GruppenLink</title>
<script>
  // SPA-Fallback für statisches Hosting (z. B. GitHub Pages):
  // /adult, /gaming, /grupo/123, /<profil> existieren nicht als Datei -> dieser Server liefert 404.html.
  // Wir leiten auf die Startseite um und geben den ursprünglichen Pfad als ?__gl=<pfad> mit.
  // index.html stellt die echte URL per history.replaceState wieder her (siehe Skript am Anfang von <head>).
  (function (l) {
    var path = l.pathname + l.search;
    // Echte Dateien (bild.png, foo.js ...) nicht umleiten: dort ist ein 404 korrekt
    if (/\.[a-z0-9]{1,8}$/i.test(l.pathname)) return;
    l.replace(l.origin + '/?__gl=' + encodeURIComponent(path) + l.hash);
  })(window.location);
</script>
</head>
<body style="font-family:system-ui,sans-serif;text-align:center;padding:4rem 1rem">
  <noscript>Bitte aktiviere JavaScript. </noscript>
  <p>Seite nicht gefunden. <a href="/">Zur Startseite</a></p>
</body>
</html>
